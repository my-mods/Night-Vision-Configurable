[Mod]
Id = NightVisionConfigurable
Name = Night Vision - Configurable
Author = oOCamilleOo
Version = 0.1.1
Description = Vampire vision with adjustable light range, brightness, colours and a thin red border. Press N or hold L3 for 0.6 seconds.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Allow N and the controller shortcut to toggle night vision. Off also ends the current effect.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.nightVisionMode]
Id = nightVisionMode
Type = picker
Label = Night Vision Mode
Description = Radius lights the area around you like a white torch. Fullscreen brightens the whole view.
Group = Appearance
PresetValues = 0|1
PresetLabels = Radius|Fullscreen
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = nightVisionMode

[Setting.radiusMeters]
Id = radiusMeters
Type = integer
Label = Light radius
Description = How far the light reaches from your character. Larger values light a wider area.
Group = Appearance
VisibleWhen = nightVisionMode
VisibleValues = 0
Minimum = 5
Maximum = 50
Step = 1
Decimals = 0
Suffix = m
Default = 6
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = radiusMeters

[Setting.vignette]
Id = vignette
Type = toggle
Label = Vignette
Description = Show a thin blood-red border at the sides while night vision is active. Hidden in menus.
Group = Appearance
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = vignette

[Setting.vignetteOpacity]
Id = vignetteOpacity
Type = percent
Label = Vignette opacity
Description = How visible the red border is. 0% hides it; 100% is strongest.
Group = Appearance
VisibleWhen = vignette
VisibleValues = 1
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 20
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = vignetteOpacity

[Setting.monochrome]
Id = monochrome
Type = percent
Label = Black & White
Description = Remove colour from the world. 0% keeps natural colours; 100% is black and white.
Group = Appearance
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = monochrome

[Setting.redMonochrome]
Id = redMonochrome
Type = percent
Label = Red tint
Description = 0% adds no red; 100% is strongest. Colours only the light in Radius mode, or the whole view in Fullscreen mode.
Group = Appearance
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = redMonochrome

[Setting.brightnessPercent]
Id = brightnessPercent
Type = percent
Label = Brightness
Description = Higher is brighter. 100% is normal game brightness in Fullscreen mode, or standard light strength in Radius mode.
Group = Appearance
Minimum = 25
Maximum = 300
Step = 5
Decimals = 0
Default = 200
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = brightnessPercent

[Setting.controllerInput]
Id = controllerInput
Type = toggle
Label = Controller shortcut
Description = Hold L3 / the left stick for 0.6 seconds to toggle vision. Release between toggles. Keyboard N remains available.
Group = Controls
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = controllerInput

[Setting.debugLogging]
Id = debugLogging
Type = toggle
Label = Logging
Description = Save troubleshooting information to ue4ss/UE4SS.log. Leave Off unless diagnosing a problem.
Group = Diagnostics
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
