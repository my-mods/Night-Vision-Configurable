[Mod]
Id = NightVisionConfigurable
Name = Night Vision - Configurable
Author = oOCamilleOo
Version = 0.1.1
Description = Vampire vision with white radius lighting or fullscreen brightness, a red vignette and optional monochrome colours. Press N or hold L3 for 0.6 seconds.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Enable night-vision controls. Turning this off restores the camera immediately.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.nightVisionMode]
Id = nightVisionMode
Type = picker
Label = Night Vision Mode
Description = Radius lights a six-metre area around you with neutral white light. Fullscreen brightens the entire view.
Group = Appearance
PresetValues = 0|1
PresetLabels = Radius|Fullscreen
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = nightVisionMode

[Setting.vignette]
Id = vignette
Type = toggle
Label = Vignette
Description = Add a blood-red effect around the edges of the screen while night vision is active.
Group = Appearance
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = vignette

[Setting.vignetteOpacity]
Id = vignetteOpacity
Type = percent
Label = Vignette opacity
Description = Strength of the red screen-edge effect. 0% is invisible; 100% is strongest.
Group = Appearance
VisibleWhen = vignette
VisibleValues = 1
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 20
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = vignetteOpacity

[Setting.monochrome]
Id = monochrome
Type = percent
Label = Black & White monochrome
Description = 0% keeps natural colours. 100% is black and white. Adjust in 5% steps. Brightness stays independent.
Group = Appearance
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = monochrome

[Setting.redMonochrome]
Id = redMonochrome
Type = percent
Label = Red monochrome
Description = Blend toward a red monochrome view in 5% steps. 0% adds no red tint; 100% is fully red monochrome. Combines with Black & White.
Group = Appearance
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = redMonochrome

[Setting.brightness]
Id = brightness
Type = slider
Label = Brightness
Description = Adjusts light strength in Radius mode and exposure in Fullscreen mode. Higher values brighten the effect.
Group = Appearance
Minimum = -2
Maximum = 4
Step = 0.1
Decimals = 1
Default = -0.5
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = brightness

[Setting.controllerInput]
Id = controllerInput
Type = toggle
Label = Controller shortcut
Description = Hold L3 / the left stick for 0.6 seconds to toggle vision. Release between toggles. Keyboard N remains available.
Group = Controls
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = controllerInput

[Setting.debugLogging]
Id = debugLogging
Type = toggle
Label = Logging
Description = Record activation, readiness and aggregated input-check timings in ue4ss/UE4SS.log.
Group = Diagnostics
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
