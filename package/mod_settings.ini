[Mod]
Id = NightVisionConfigurable
Name = Night Vision - Configurable
Author = oOCamilleOo
Version = 0.1.1
Description = See in the dark with natural colours or adjustable monochrome. Press N or hold the left stick for 0.6 seconds in vampire form.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Enable night-vision controls. Turning this off restores the camera immediately.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.monochrome]
Id = monochrome
Type = percent
Label = Monochrome amount
Description = 0% keeps natural colours. 100% is black and white. Adjust in 5% steps. Brightness stays independent.
Group = Appearance
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = monochrome

[Setting.brightness]
Id = brightness
Type = slider
Label = Brightness
Description = Night-vision exposure compensation. Higher values brighten the image. Changes apply while vision is active.
Group = Appearance
Minimum = -2
Maximum = 4
Step = 0.1
Decimals = 1
Default = -0.5
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = brightness

[Setting.controllerInput]
Id = controllerInput
Type = toggle
Label = Controller shortcut
Description = Hold L3 / the left stick for 0.6 seconds to toggle vision. Release between toggles. Keyboard N remains available.
Group = Controls
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = controllerInput

[Setting.debugLogging]
Id = debugLogging
Type = toggle
Label = Logging
Description = Record activation, readiness and aggregated input-check timings in ue4ss/UE4SS.log.
Group = Diagnostics
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
