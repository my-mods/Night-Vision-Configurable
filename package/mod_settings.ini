[Mod]
Id = NightVisionConfigurable
Name = Night Vision - Configurable
Author = oOCamilleOo
Version = 0.1.1
Description = Fullscreen, Natural or Radius vampire vision, with adjustable brightness, colours and a soft red vampire vignette. Press N or hold L3 for 0.6 seconds.

[Setting.enabled]
Id = enabled
Type = toggle
Label = Enabled
Description = Allow N and the controller shortcut to toggle night vision. Off also ends the current effect.
Group = General
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.nightVisionMode]
Id = nightVisionMode
Type = picker
Label = Night Vision Mode
Description = Fullscreen brightens the whole view and is the default. Natural brightens a soft central oval. Radius brightens nearby scenery with a soft distance fade.
Group = Appearance
PresetValues = 1|2|0
PresetLabels = Fullscreen|Natural|Radius
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = nightVisionMode

[Setting.radiusMeters]
Id = radiusMeters
Type = integer
Label = Vision radius
Description = Distance from your character where the brightness enhancement ends. Larger values reveal a wider area.
Group = Appearance
VisibleWhen = nightVisionMode
VisibleValues = 0
Minimum = 5
Maximum = 50
Step = 1
Decimals = 0
Suffix = m
Default = 6
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = radiusMeters

[Setting.naturalFocusSize]
Id = naturalFocusSize
Type = percent
Label = Natural size
Description = Width and height of Natural's outer oval relative to the screen. Larger values reveal more of the view while retaining dark outer margins.
Group = Appearance
VisibleWhen = nightVisionMode
VisibleValues = 2
Minimum = 40
Maximum = 100
Step = 5
Decimals = 0
Default = 90
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = naturalFocusSize

[Setting.naturalSoftness]
Id = naturalSoftness
Type = percent
Label = Fade softness
Description = How much of Natural's radius fades gradually into normal night vision. Higher values spread the fade further toward the center.
Group = Appearance
VisibleWhen = nightVisionMode
VisibleValues = 2
Minimum = 20
Maximum = 100
Step = 5
Decimals = 0
Default = 70
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = naturalSoftness

[Setting.vignette]
Id = vignette
Type = toggle
Label = Vignette
Description = Show softly fading red veins around the edges, using the game's vampire effect. Hidden in menus.
Group = Appearance
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = vignette

[Setting.vignetteOpacity]
Id = vignetteOpacity
Type = percent
Label = Vignette opacity
Description = How visible the vampire vignette is. 0% hides it; 100% is strongest.
Group = Appearance
VisibleWhen = vignette
VisibleValues = 1
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 20
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = vignetteOpacity

[Setting.monochrome]
Id = monochrome
Type = percent
Label = Black & White
Description = 0% keeps natural colours; 100% is black and white. Natural affects only the bright oval with a soft fade; Radius and Fullscreen affect the whole view.
Group = Appearance
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = monochrome

[Setting.keepBloodRed]
Id = keepBloodRed
Type = toggle
Label = Keep blood red
Description = Keep blood and other red shades visible with Black & White. Natural applies this only inside the oval. The border stays red independently. Use HDR output off.
Group = Appearance
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = keepBloodRed

[Setting.redBrightnessPercent]
Id = redBrightnessPercent
Type = percent
Label = Red brightness
Description = Brighten reds preserved by Black & White. 100% keeps their brightness; higher values make them stand out more. Natural confines this to the oval.
Group = Appearance
VisibleWhen = keepBloodRed
VisibleValues = 1
Minimum = 100
Maximum = 500
Step = 10
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = redBrightnessPercent

[Setting.redMonochrome]
Id = redMonochrome
Type = percent
Label = Red tint
Description = 0% adds no red; 100% is strongest. Colours only the enhanced area in Radius mode, or the whole view in Fullscreen mode.
Group = Appearance
VisibleWhen = nightVisionMode
VisibleValues = 0|1
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = redMonochrome

[Setting.brightnessPercent]
Id = brightnessPercent
Type = percent
Label = Brightness
Description = Higher is brighter. 100% keeps normal brightness in every mode. Natural changes only the central oval.
Group = Appearance
Minimum = 25
Maximum = 300
Step = 5
Decimals = 0
Default = 200
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = brightnessPercent

[Setting.controllerInput]
Id = controllerInput
Type = toggle
Label = Controller shortcut
Description = Hold L3 / the left stick for 0.6 seconds to toggle vision. Release between toggles. Keyboard N remains available.
Group = Controls
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = controllerInput

[Setting.debugLogging]
Id = debugLogging
Type = toggle
Label = Logging
Description = Save troubleshooting information to ue4ss/UE4SS.log. Leave Off unless diagnosing a problem.
Group = Diagnostics
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = debugLogging
